image boot.vfat {
	vfat {
		label = "NOTABOOT"
		files = {
			"bcm2711-rpi-4-b.dtb",
			"bcm2711-rpi-400.dtb",
			"rpi-firmware/start4.elf",
			"rpi-firmware/fixup4.dat",
			"rpi-firmware/config.txt",
			"rpi-firmware/cmdline.txt",
			"rpi-firmware/notatv-slot.txt",
			"rpi-firmware/overlays",
			"Image"
		}
	}
	size = 64M
}

image data.ext4 {
	ext4 {
		label = "NOTADATA"
		use-mke2fs = true
		extraargs = "-m 0"
	}
	size = 256M
}

image notatv-rpi4.img {
	hdimage {
		# fixed disk id: cmdline.txt finds rootfs as PARTUUID=7b0c5a01-02 (works from both SD and USB)
		disk-signature = 0x7b0c5a01
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
