# NotaTV mpv defaults (the user's choices are passed as arguments by tvshell)
# Pi: the GPU (V3D) is too weak to draw video (7 fps in 4K). Decoded frames are therefore put
# directly on the display's primary plane (like Kodi/LibreELEC), and only OSD/subtitles are drawn with GL on
# an overlay plane above - in 1080p, scaled up by the display hardware. HDR is sent to the TV based on
# the source's color space (see board/rpi4/patches/mpv). The plane order matters: vc4 only allows
# zpos>=1 on overlay planes, so video on the overlay (mpv's default) is rejected with EINVAL.
profile=fast
vo=gpu
gpu-context=drm
opengl-es=yes
hwdec=drm,v4l2m2m,auto-safe
hwdec-codecs=all
gpu-hwdec-interop=drmprime-overlay
drm-draw-plane=overlay
drm-drmprime-video-plane=primary
drm-draw-surface-size=1920x1080
target-colorspace-hint=yes
video-sync=audio
interpolation=no
osd-fonts-dir=/usr/share/tvshell
osc=no
osd-bar=no
scripts=/usr/share/notatv/mpv/notatv-osd.lua
osd-font=Inter
osd-font-size=38
osd-bar-h=2
osd-border-size=2
osd-duration=2500
osd-playing-msg=${media-title}
sub-fonts-dir=/usr/share/fonts/dejavu
sub-font=DejaVu Sans
sub-font-size=46
sub-border-size=2.5
sub-auto=fuzzy
audio-channels=auto
cache=yes
demuxer-max-bytes=256MiB
demuxer-readahead-secs=20
network-timeout=20
ytdl=yes
script-opts=ytdl_hook-ytdl_path=/usr/bin/yt-dlp
input-default-bindings=yes
volume=100
volume-max=100
screenshot-directory=/tmp
include=/run/notatv/mpv-local.conf
# Pi: v3d and vc4 are two DRM cards; mpv must use the one with display outputs (written by S12rpi-audio)
include=/run/notatv/mpv-drm.conf
