# A6 (audit 9/11): the user interface and every app run headless with AddressSanitizer and UBSan
# (scripts/ci-uitest.sh, about 2 minutes). Runs on every push to main and on pull requests, and the Release and
# Apps workflows wait for it: a release is not built when it finds a memory error or undefined behaviour.
# The screenshots and logs are kept as an artifact for a week.
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: "The tag or commit to test (from Release/Apps)"
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uitest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SDL3_VERSION: "3.4.12" # the same as the image (buildroot/package/sdl3)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Packages
        # Ubuntu's mirrors are sometimes unreachable from GitHub's runners: fail after a few minutes, not 28
        timeout-minutes: 8
        run: |
          # GitHub's runners use Azure's own mirror (azure.archive.ubuntu.com), which is sometimes unreachable
          # (11/11: an hour without DNS for it): use Ubuntu's main archive instead
          sudo sed -i 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#; s#http://azure.archive.ubuntu.com/ubuntu/#http://archive.ubuntu.com/ubuntu/#' \
            /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y -qq build-essential cmake ninja-build pkg-config python3-pil \
            libcurl4-openssl-dev libdrm-dev libegl-dev libgles-dev libgbm-dev libdbus-1-dev libupnp-dev zlib1g-dev
      - name: SDL3 from the cache
        id: sdl
        uses: actions/cache@v4
        with:
          path: ~/sdl3
          key: sdl3-${{ env.SDL3_VERSION }}-ubuntu-24.04
      - name: Build SDL3 (Ubuntu 24.04 has none)
        if: steps.sdl.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://www.libsdl.org/release/SDL3-$SDL3_VERSION.tar.gz" | tar -xz # where Buildroot fetches it
          cmake -S "SDL3-$SDL3_VERSION" -B sdl-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/sdl3" \
            -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_UNIX_CONSOLE_BUILD=ON # headless: only the offscreen driver
          cmake --build sdl-build
          cmake --install sdl-build
      - name: Run every screen with ASan and UBSan
        run: |
          export PKG_CONFIG_PATH="$HOME/sdl3/lib/pkgconfig:$HOME/sdl3/lib64/pkgconfig"
          export LD_LIBRARY_PATH="$HOME/sdl3/lib:$HOME/sdl3/lib64"
          scripts/ci-uitest.sh "$RUNNER_TEMP/uitest"
      - name: Keep the screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uitest
          path: ${{ runner.temp }}/uitest
          retention-days: 7
