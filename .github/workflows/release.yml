# Release: push a tag like v1.0.1 and the build machine (self-hosted runner with the label "notatv")
# builds the Pi 4 image and publishes a GitHub release with the image and the update files.
#
# It builds in /opt/notatv (not the runner's work folder), so no home folder paths end up in
# the image and the build folder is kept between releases: normally only NotaTV's own packages
# are rebuilt. If configs, patches or packages changed since the last build, it builds from scratch.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  TREE: /opt/notatv
  REPO_URL: https://github.com/${{ github.repository }}.git

jobs:
  build:
    runs-on: [self-hosted, linux, notatv]
    timeout-minutes: 720
    steps:
      - name: Fetch the tagged code into /opt/notatv
        run: |
          set -e
          mkdir -p "$TREE"
          cd "$TREE"
          # also works if the folder already exists without git (e.g. a build made by hand)
          [ -d .git ] || git init -q
          git remote add origin "$REPO_URL" 2>/dev/null || git remote set-url origin "$REPO_URL"
          git fetch --force --tags origin
          git checkout --force --detach "$GITHUB_REF_NAME"
          git clean -fd   # removes stray files, keeps ignored ones (buildroot/, dl/, output-rpi4/, secrets/)
          test "v$(cat VERSION)" = "$GITHUB_REF_NAME" || { echo "VERSION is $(cat VERSION), but the tag is $GITHUB_REF_NAME"; exit 1; }
          # texts in English in the code, Danish in lang/da.po - stop before building if not
          python3 scripts/i18n-check.py > i18n.log || { grep -vE ' 0 missing, 0 placeholder mismatches' i18n.log; echo 'Translations are missing or wrong (scripts/i18n-check.py)'; exit 1; }

      - name: Twitch Client ID
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
        run: |
          mkdir -p "$TREE/secrets"
          if [ -n "$TWITCH_CLIENT_ID" ]; then
            printf '%s\n' "$TWITCH_CLIENT_ID" > "$TREE/secrets/twitch-client-id"
          else
            echo "::warning::The TWITCH_CLIENT_ID secret is not set - Twitch login will not work in this image"
          fi

      - name: TV 2 and DRTV Client IDs
        env:
          TV2_CLIENT_ID: ${{ secrets.TV2_CLIENT_ID }}
          DRTV_CLIENT_ID: ${{ secrets.DRTV_CLIENT_ID }}
        run: |
          mkdir -p "$TREE/secrets"
          if [ -n "$TV2_CLIENT_ID" ]; then
            printf '%s\n' "$TV2_CLIENT_ID" > "$TREE/secrets/tv2-client-id"
          else
            echo "::warning::The TV2_CLIENT_ID secret is not set - TV 2 Play login will not work"
          fi
          if [ -n "$DRTV_CLIENT_ID" ]; then
            printf '%s\n' "$DRTV_CLIENT_ID" > "$TREE/secrets/drtv-client-id"
          else
            echo "::warning::The DRTV_CLIENT_ID secret is not set - DRTV works without an account only"
          fi

      - name: Decide what to rebuild
        shell: bash
        run: |
          cd "$TREE"
          OUT=output-rpi4
          LAST=$(cat $OUT/.notatv-built 2>/dev/null || true)
          # changes Buildroot does not notice by itself -> start over (ccache keeps that from being too slow)
          # (config.txt/cmdline.txt are only copied when rpi-firmware is built, uapi/ only when ffmpeg is built)
          FULL='^(Makefile|external/(Config\.in|external\.(mk|desc)|configs/|package/)|external/board/[^/]+/(patches/|uapi/|[^/]*\.fragment|rpi-ffmpeg|ffmpeg-override|config\.txt|cmdline\.txt))'
          # overlays and post-build/post-image run on every build, but a deleted or renamed overlay file stays in
          # target/ and would go into the update package -> also start over then
          GONE='^external/board/[^/]+/(rootfs-overlay|overlay)/'
          OWN='^external/package/(tvshell|tvmoon|rpi-tools)/'
          if [ ! -d $OUT ]; then
            echo "No earlier build - full build"
          elif [ -z "$LAST" ] || ! git cat-file -e "$LAST" 2>/dev/null; then
            echo "Earlier build made by hand - keeping it, rebuilding tvshell, tvmoon and rpi-tools"
            make -C buildroot O=$TREE/$OUT BR2_EXTERNAL=$TREE/external tvshell-dirclean tvmoon-dirclean rpi-tools-dirclean
          elif git diff --name-only "$LAST" HEAD | grep -vE "$OWN" | grep -qE "$FULL"; then
            echo "Configuration, patches or packages changed since $LAST - full build:"
            git diff --name-only "$LAST" HEAD | grep -vE "$OWN" | grep -E "$FULL"
            rm -rf $OUT
          elif git diff --name-only --diff-filter=DR "$LAST" HEAD | grep -qE "$GONE"; then
            echo "Overlay files removed or renamed since $LAST - full build:"
            git diff --name-status --diff-filter=DR "$LAST" HEAD | grep -E "$GONE"
            rm -rf $OUT
          else
            echo "Only NotaTV's own code changed since $LAST - rebuilding tvshell, tvmoon and rpi-tools"
            make -C buildroot O=$TREE/$OUT BR2_EXTERNAL=$TREE/external tvshell-dirclean tvmoon-dirclean rpi-tools-dirclean
          fi
          # rpi-ffmpeg is fetched again if the pinned commit or our patches for it changed
          if [ -d src/rpi-ffmpeg ] && [ "$(cat src/rpi-ffmpeg/.notatv-commit 2>/dev/null)" != "$(make -s rpi-ffmpeg-stamp)" ]; then
            rm -rf src/rpi-ffmpeg
          fi

      - name: Build (full log in /opt/notatv/build.log)
        shell: bash
        run: |
          cd "$TREE"
          rm -f notatv-rpi4.img notatv-rpi4.img.xz notatv-rpi4-update.tar.gz notatv-rpi4-update.tar.gz.sha256
          make rpi4 > build.log 2>&1 || { tail -80 build.log; exit 1; }
          git rev-parse HEAD > output-rpi4/.notatv-built
          xz -T0 -k -f notatv-rpi4.img
          # the update package must say the right version, have the file list, and tvshell must show it
          V=$(cat VERSION)
          # (no grep -q directly on tar: with pipefail, grep stopping early makes tar fail with a write error)
          tar -tzf notatv-rpi4-update.tar.gz > pkg.list
          tar -xzOf notatv-rpi4-update.tar.gz rootfs/etc/notatv-release > pkg.release
          tar -xzOf notatv-rpi4-update.tar.gz rootfs/usr/bin/tvshell > pkg.tvshell
          grep -q "^VERSION=$V " pkg.release || { echo "update package: wrong /etc/notatv-release"; exit 1; }
          grep -qx 'rootfs/usr/share/notatv/files.list' pkg.list || { echo "update package: files.list missing"; exit 1; }
          grep -aq "NotaTV/$V" pkg.tvshell || { echo "update package: tvshell was not built with version $V"; exit 1; }
          ! grep -Eq '^rootfs/(data|dev|proc|sys|tmp|run|media|mnt)/.' pkg.list || { echo "update package: contains runtime folders"; exit 1; }
          rm -f pkg.list pkg.release pkg.tvshell
          ls -la notatv-rpi4.img.xz notatv-rpi4-update.tar.gz notatv-rpi4-update.tar.gz.sha256
          # the apps for the App Store (they are not in the image): packages + catalog in dist-apps/
          # Peezy: flutter-pi, its libraries and Plezy's Flutter bundle next to its app.so (src/apps/peezy/build,
          # the Flutter toolchain is kept in tools/ between builds); without them apps-catalog.py leaves Peezy out
          src/apps/peezy/build/package.sh output-rpi4/build/tvshell-1.0/apps-out/peezy all > peezy-build.log 2>&1 || { tail -80 peezy-build.log; exit 1; }
          rm -rf dist-apps
          python3 scripts/apps-catalog.py output-rpi4/build/tvshell-1.0/apps-out dist-apps --strip output-rpi4/host/bin/aarch64-linux-strip --notes apps-notes.md --tools src/tools --dl dl
          ls -la dist-apps

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$TREE"
          python3 - <<'EOF'
          import json, os, urllib.error, urllib.request
          repo, tag, tok = os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_REF_NAME"], os.environ["GH_TOKEN"]
          hdr = {"Authorization": "Bearer " + tok, "Accept": "application/vnd.github+json"}
          def call(url, data=None, method=None, ctype="application/json"):
              req = urllib.request.Request(url, data=data, method=method, headers=dict(hdr, **{"Content-Type": ctype}))
              with urllib.request.urlopen(req) as r:
                  return json.load(r)
          api = f"https://api.github.com/repos/{repo}/releases"
          # release notes: the section "## <version>" of CHANGELOG.md (GitHub adds its "Full Changelog" link below)
          notes, ver, sec = [], tag.lstrip("v"), False
          if os.path.exists("CHANGELOG.md"):
              for line in open("CHANGELOG.md", encoding="utf-8"):
                  if line.startswith("## "):
                      if sec: break
                      sec = line[3:].strip() == ver
                      continue
                  if sec: notes.append(line)
          body = "".join(notes).strip()
          if not body: print(f"::warning::CHANGELOG.md has no section '## {ver}' - the release gets no notes")
          try:
              rel = call(f"{api}/tags/{tag}")
              if body:  # running again: the notes follow CHANGELOG.md
                  call(f"{api}/{rel['id']}", json.dumps({"body": body}).encode(), method="PATCH")
          except urllib.error.HTTPError as e:
              if e.code != 404: raise
              # a new release is made as a draft and published only when all files are uploaded: boxes that check
              # meanwhile must not find a release without its .sha256 ("Download failed"). /tags/ does not see
              # drafts, so a draft left by a failed run is reused
              rel = next((r for r in call(f"{api}?per_page=30") if r.get("draft") and r.get("tag_name") == tag), None)
              if rel is None:
                  rel = call(api, json.dumps({"tag_name": tag, "name": "NotaTV " + ver, "body": body, "draft": True,
                                              "generate_release_notes": True}).encode())
          names = ["notatv-rpi4.img.xz", "notatv-rpi4-update.tar.gz", "notatv-rpi4-update.tar.gz.sha256"]
          for a in rel.get("assets", []):  # running again for the same tag replaces the files
              if a["name"] in names:
                  urllib.request.urlopen(urllib.request.Request(f"{api}/assets/{a['id']}", method="DELETE", headers=hdr))
          for n in names:
              with open(n, "rb") as f:
                  call(f"https://uploads.github.com/repos/{repo}/releases/{rel['id']}/assets?name={n}",
                       data=f.read(), ctype="application/octet-stream")
              print("uploaded", n)
          if rel.get("draft"):
              rel = call(f"{api}/{rel['id']}", json.dumps({"draft": False, "make_latest": "true"}).encode(), method="PATCH")
          print(rel["html_url"])

          # the App Store: the release "apps" (a pre-release, so it never counts as the latest NotaTV) holds every
          # app package and one catalog per app API version. Files with the same name are replaced; packages for
          # older app API versions stay, so boxes that are not updated yet keep finding their apps.
          try:
              store = call(f"{api}/tags/apps")
          except urllib.error.HTTPError as e:
              if e.code != 404: raise
              store = call(api, json.dumps({"tag_name": "apps", "target_commitish": os.environ["GITHUB_SHA"],
                                            "name": "NotaTV App Store", "prerelease": True, "make_latest": "false",
                                            "body": "App packages for the NotaTV App Store. Boxes download them from here - do not delete."}).encode())
          # the release text: every app with its version and what is new (made by apps-catalog.py --notes)
          if os.path.exists("apps-notes.md"):
              call(f"{api}/{store['id']}", json.dumps({"body": open("apps-notes.md", encoding="utf-8").read()}).encode(), method="PATCH")
          # each file is replaced right before its upload (not all deleted first: boxes would meanwhile find no catalog),
          # and a file GitHub already has with the same SHA256 is left alone (packages are reproducible)
          import hashlib
          files = sorted(os.listdir("dist-apps"))
          have = {a["name"]: a for a in store.get("assets", [])}
          def same(n):
              d = have.get(n, {}).get("digest") or ""
              return d == "sha256:" + hashlib.sha256(open(os.path.join("dist-apps", n), "rb").read()).hexdigest()
          files = [n for n in files if not same(n)]
          # packages first, the catalog last: a box never sees a catalog entry before its file is there
          for n in sorted(files, key=lambda f: f.endswith(".json")):
              if n in have:
                  urllib.request.urlopen(urllib.request.Request(f"{api}/assets/{have[n]['id']}", method="DELETE", headers=hdr))
              with open(os.path.join("dist-apps", n), "rb") as f:
                  call(f"https://uploads.github.com/repos/{repo}/releases/{store['id']}/assets?name={n}",
                       data=f.read(), ctype="application/octet-stream")
              print("app store:", n)
          EOF
