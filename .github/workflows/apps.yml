# App Store only: push a tag like apps-2026-11-05 (or press "Run workflow" on GitHub) and the build machine
# builds just the app packages and updates the release "apps". No new NotaTV version, no image, no update package.
#
# It uses the build folder /opt/notatv that release.yml keeps, so a system release must have been built there
# before. Only tvshell is built again (the apps are built with it, against its tv.h); nothing is installed.
# If src/shell/tv.h changed since the latest system release, the apps could need a tvshell the boxes do not
# have yet - then it stops: make a system release (v*) instead, it publishes the apps too.
# Remember to raise "version" in the manifest.json of each app that changed, or the boxes see no update.
#
# Where it is built: a tag push uses the repository variable BUILD_ON ("github" or "build-machine", not set =
# the build machine); "Run workflow" asks. GitHub's runner has no build folder from earlier, so it builds the
# whole system tree first (about 1.5 hours, dl/ and .ccache/ come from the Actions cache).
name: Apps

on:
  push:
    tags: ["apps-*"]
  workflow_dispatch:
    inputs:
      runner:
        description: "Where to build"
        type: choice
        options: [github, build-machine]
        default: github
      channel:
        description: "stable = every box gets the apps now; beta = the store apps-beta (Promote with a system release)"
        type: choice
        options: [stable, beta]
        default: stable

permissions:
  contents: write

concurrency:
  group: release # never at the same time as a system release (same build folder)
  cancel-in-progress: false

env:
  # where to build: the form for "Run workflow", otherwise the variable BUILD_ON (default: the build machine)
  ON: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || vars.BUILD_ON || 'build-machine' }}
  CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || vars.RELEASE_CHANNEL || 'stable' }}
  TREE: ${{ (github.event_name == 'workflow_dispatch' && inputs.runner || vars.BUILD_ON || 'build-machine') == 'github' && '/home/runner/notatv' || '/opt/notatv' }}
  REPO_URL: https://github.com/${{ github.repository }}.git

jobs:
  apps:
    # (the same choice as ON above: runs-on cannot read env)
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.runner || vars.BUILD_ON || 'build-machine') == 'github' && 'ubuntu-24.04' || fromJSON('["self-hosted","linux","notatv"]') }}
    timeout-minutes: 300 # GitHub's runner builds the system tree first
    steps:
      - name: Where this is built
        run: echo "Building the apps on $ON in $TREE"

      - name: Host packages (GitHub's runner only)
        if: env.ON == 'github'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential file wget curl cpio unzip rsync bc \
            libncurses-dev libssl-dev python3 git xz-utils bzip2 zstd

      - name: Fetch the code into the build folder
        run: |
          set -e
          mkdir -p "$TREE"
          cd "$TREE"
          if [ "$ON" = github ]; then
            [ -d .git ] || git init -q
            git remote add origin "$REPO_URL" 2>/dev/null || git remote set-url origin "$REPO_URL"
          else
            test -d output-rpi4 || { echo "No earlier build in $TREE - make a system release (v*) first"; exit 1; }
            git remote set-url origin "$REPO_URL"
          fi
          git fetch --force --tags origin
          git checkout --force --detach "$GITHUB_SHA"
          git clean -fd
          LAST=$(git tag -l 'v*' --sort=-v:refname --merged HEAD | head -1)
          # texts in English in the code, Danish in lang/da.po - stop before building if not
          python3 scripts/i18n-check.py > i18n.log || { grep -vE ' 0 missing, 0 placeholder mismatches' i18n.log; echo 'Translations are missing or wrong (scripts/i18n-check.py)'; exit 1; }
          echo "Latest system release: $LAST"
          if ! git diff --quiet "$LAST" HEAD -- src/shell/tv.h; then
            echo "src/shell/tv.h changed since $LAST - the apps may need a newer tvshell. Make a system release instead."
            exit 1
          fi

      - name: Client IDs
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TV2_CLIENT_ID: ${{ secrets.TV2_CLIENT_ID }}
          DRTV_CLIENT_ID: ${{ secrets.DRTV_CLIENT_ID }}
        run: |
          mkdir -p "$TREE/secrets"
          if [ -n "$TWITCH_CLIENT_ID" ]; then printf '%s\n' "$TWITCH_CLIENT_ID" > "$TREE/secrets/twitch-client-id"
          else echo "::warning::The TWITCH_CLIENT_ID secret is not set - Twitch login will not work"; fi
          if [ -n "$TV2_CLIENT_ID" ]; then printf '%s\n' "$TV2_CLIENT_ID" > "$TREE/secrets/tv2-client-id"
          else echo "::warning::The TV2_CLIENT_ID secret is not set - TV 2 Play login will not work"; fi
          if [ -n "$DRTV_CLIENT_ID" ]; then printf '%s\n' "$DRTV_CLIENT_ID" > "$TREE/secrets/drtv-client-id"
          else echo "::warning::The DRTV_CLIENT_ID secret is not set - DRTV works without an account only"; fi

      - name: Restore dl/ and .ccache/ (GitHub's runner only)
        if: env.ON == 'github'
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.TREE }}/dl
            ${{ env.TREE }}/.ccache
          key: notatv-build-${{ github.run_id }}
          restore-keys: notatv-build-

      - name: Build the system tree (GitHub's runner only, log in build.log)
        if: env.ON == 'github'
        shell: bash
        run: |
          cd "$TREE"
          make rpi4 > build.log 2>&1 || { tail -80 build.log; exit 1; }

      - name: Build the apps (log in apps-build.log in the build folder)
        shell: bash
        run: |
          cd "$TREE"
          make -C buildroot O=$TREE/output-rpi4 BR2_EXTERNAL=$TREE/external tvshell-dirclean tvshell-build \
            > apps-build.log 2>&1 || { tail -80 apps-build.log; exit 1; }
          # Peezy: flutter-pi, its libraries and Plezy's Flutter bundle next to its app.so (src/apps/peezy/build,
          # the Flutter toolchain is kept in tools/ between builds); without them apps-catalog.py leaves Peezy out
          src/apps/peezy/build/package.sh output-rpi4/build/tvshell-1.0/apps-out/peezy all > peezy-build.log 2>&1 || { tail -80 peezy-build.log; exit 1; }
          rm -rf dist-apps
          python3 scripts/apps-catalog.py output-rpi4/build/tvshell-1.0/apps-out dist-apps --strip output-rpi4/host/bin/aarch64-linux-strip --notes apps-notes.md --tools src/tools --dl dl
          ls -la dist-apps

      - name: Publish to the App Store
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$TREE"
          python3 - <<'EOF'
          import json, os, urllib.error, urllib.request
          repo, tok = os.environ["GITHUB_REPOSITORY"], os.environ["GH_TOKEN"]
          hdr = {"Authorization": "Bearer " + tok, "Accept": "application/vnd.github+json"}
          def call(url, data=None, method=None, ctype="application/json"):
              req = urllib.request.Request(url, data=data, method=method, headers=dict(hdr, **{"Content-Type": ctype}))
              with urllib.request.urlopen(req) as r:
                  return json.load(r)
          api = f"https://api.github.com/repos/{repo}/releases"
          beta = os.environ.get("CHANNEL") == "beta"  # P1: the beta store (see release.yml and promote.yml)
          store_tag = "apps-beta" if beta else "apps"
          # same as in release.yml: replace files with the same name, packages first, the catalog last
          try:
              store = call(f"{api}/tags/{store_tag}")
          except urllib.error.HTTPError as e:
              if e.code != 404: raise
              store = call(api, json.dumps({"tag_name": store_tag, "target_commitish": os.environ["GITHUB_SHA"],
                                            "name": "NotaTV App Store" + (" (beta)" if beta else ""), "prerelease": True, "make_latest": "false",
                                            "body": "App packages for the NotaTV App Store. Boxes download them from here - do not delete."}).encode())
          # the release text: every app with its version and what is new (made by apps-catalog.py --notes)
          if os.path.exists("apps-notes.md"):
              call(f"{api}/{store['id']}", json.dumps({"body": open("apps-notes.md", encoding="utf-8").read()}).encode(), method="PATCH")
          # each file is replaced right before its upload (not all deleted first: boxes would meanwhile find no catalog),
          # and a file GitHub already has with the same SHA256 is left alone (packages are reproducible)
          import hashlib
          files = sorted(os.listdir("dist-apps"))
          have = {a["name"]: a for a in store.get("assets", [])}
          def same(n):
              d = have.get(n, {}).get("digest") or ""
              return d == "sha256:" + hashlib.sha256(open(os.path.join("dist-apps", n), "rb").read()).hexdigest()
          files = [n for n in files if not same(n)]
          for n in sorted(files, key=lambda f: f.endswith(".json")):
              if n in have:
                  urllib.request.urlopen(urllib.request.Request(f"{api}/assets/{have[n]['id']}", method="DELETE", headers=hdr))
              with open(os.path.join("dist-apps", n), "rb") as f:
                  call(f"https://uploads.github.com/repos/{repo}/releases/{store['id']}/assets?name={n}",
                       data=f.read(), ctype="application/octet-stream")
              print("app store:", n)
          EOF
